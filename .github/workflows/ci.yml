name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main est vérifié par le workflow Release
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Types, lint, tests et build
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   # inutile pour les tests et le build web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build (interface, Electron, serveur MCP)
        run: npm run build
