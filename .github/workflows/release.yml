name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: Version, .exe et release GitHub
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write        # tag, commit du CHANGELOG, release
      issues: write
      pull-requests: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # pas de certificat de signature de code
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # semantic-release lit tout l'historique et les tags
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag de base v1.1.0 (point de départ de la numérotation)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote --exit-code --tags "$remote" refs/tags/v1.1.0 >/dev/null; then
            git tag v1.1.0 f89f534baf9f165f506b7d23e39ee032846db8f3
            git push "$remote" refs/tags/v1.1.0
          fi
      - name: semantic-release (calcule la version, construit les .exe, publie)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -o pipefail
          npx semantic-release 2>&1 | tee semantic-release.log || {
            # Remonte l'erreur en annotations (visibles dans le résumé du run, sans ouvrir les journaux)
            grep -E "✘|×|E[A-Z]{5,}|Error|error" semantic-release.log | head -15 | while IFS= read -r line; do echo "::error title=semantic-release::${line}"; done
            exit 1
          }
      - name: Conserver les fichiers construits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrimoine-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: ignore
          retention-days: 14
